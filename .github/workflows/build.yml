name: Sonidex CI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            target: sonidex-linux-amd64
          - os: linux
            arch: amd64
            target: sonidex-linux-wayland-amd64
            tags: wayland
          - os: windows
            arch: amd64
            target: sonidex-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev libasound2-dev gcc-mingw-w64 \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Regenerate Clean Checksums
        run: |
          rm -f go.sum
          go mod tidy

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          BUILD_TAGS=""
          if [ -n "${{ matrix.tags }}" ]; then
            BUILD_TAGS="-tags ${{ matrix.tags }}"
          fi
          if [ "${{ matrix.os }}" = "windows" ]; then
            export CC=x86_64-w64-mingw32-gcc
            go build $BUILD_TAGS -ldflags="-H windowsgui -s -w" -o ${{ matrix.target }} .
          else
            go build $BUILD_TAGS -ldflags="-s -w" -o ${{ matrix.target }} .
          fi

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}

  build-tui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Regenerate Clean Checksums
        run: |
          rm -f go.sum
          go mod tidy

      - name: Build Binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: go build -ldflags="-s -w" -o sonidex-tui-linux-amd64 ./cmd/sonidex-tui

      - name: Upload TUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonidex-tui-linux-amd64
          path: sonidex-tui-linux-amd64

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Regenerate Clean Checksums
        run: |
          rm -f go.sum
          go mod tidy

      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest

      - name: Build Android APK
        run: |
          fyne-cross android -app-id com.local.sonidex -icon icon.png .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonidex-android-apk
          path: fyne-cross/dist/android/*.apk

  release:
    name: Tag and Release
    needs: [build-desktop, build-android, build-tui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten Artifacts for Release
        run: |
          mkdir -p release-assets
          find dist -type f \( \
            -name 'sonidex-linux-amd64' -o \
            -name 'sonidex-linux-wayland-amd64' -o \
            -name 'sonidex-windows-amd64.exe' -o \
            -name 'sonidex-tui-linux-amd64' -o \
            -name '*.apk' \
          \) -exec cp {} release-assets/ \;
          echo "Assets staged for release:"
          ls -la release-assets

      - name: Create Tagged Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Sonidex ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
